<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Synpera</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root, [data-theme="dark"] {
    --bg:#070b16; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12);
    --text:#e9eef7; --muted:#93a1b8; --input:rgba(255,255,255,.05);
    --accent-soft:rgba(59,130,246,.12); --accent-border:rgba(59,130,246,.45); --accent-text:#93c5fd;
  }
  [data-theme="light"] {
    --bg:#f6f8fc; --card:rgba(255,255,255,.75); --border:rgba(15,23,42,.12);
    --text:#0f172a; --muted:#5b6b84; --input:rgba(15,23,42,.04);
    --accent-soft:rgba(29,78,216,.08); --accent-border:rgba(29,78,216,.4); --accent-text:#1d4ed8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',system-ui,sans-serif; min-height:100vh;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden; transition:background .35s, color .35s;
  }
  .blob { position:absolute; border-radius:50%; filter:blur(130px); opacity:.26; animation:drift 16s ease-in-out infinite alternate; }
  [data-theme="light"] .blob { opacity:.15; }
  .b1 { width:480px;height:480px; background:#1e3a8a; top:-140px; left:-120px; }
  .b2 { width:400px;height:400px; background:#0e7490; bottom:-120px; right:-100px; animation-delay:-8s; }
  @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(50px,40px) scale(1.12);} }
  .card {
    width:100%; max-width:420px; padding:40px 36px; border-radius:24px;
    background:var(--card); border:1px solid var(--border);
    backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
    animation:fadeUp .6s ease both; position:relative; z-index:1;
  }
  @keyframes fadeUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  .logo { display:flex; align-items:center; justify-content:center; gap:11px; font-weight:800; font-size:1.25rem; text-decoration:none; color:var(--text); margin-bottom:6px; }
  .logo img { width:36px;height:36px; object-fit:contain; }
  h1 { text-align:center; font-size:1.45rem; font-weight:800; margin:16px 0 6px; letter-spacing:-.02em; }
  .sub { text-align:center; color:var(--muted); font-size:.92rem; margin-bottom:28px; }
  label { display:block; font-size:.85rem; font-weight:600; margin-bottom:7px; }
  .field { margin-bottom:18px; }
  .input-wrap { position:relative; }
  input {
    width:100%; padding:13px 16px; border-radius:13px; font-size:.95rem; font-family:inherit;
    background:var(--input); border:1px solid var(--border); color:var(--text); outline:none; transition:all .25s;
  }
  input:focus { border-color:var(--accent-border); box-shadow:0 0 0 3px var(--accent-soft); }
  .toggle-pw {
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:8px; border-radius:8px;
    color:var(--muted); transition:color .2s; display:grid; place-items:center;
  }
  .toggle-pw:hover { color:var(--text); }
  .btn {
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    font-weight:700; font-size:1rem; font-family:inherit; color:#fff;
    background:linear-gradient(135deg,#2563eb,#0891b2);
    box-shadow:0 4px 20px rgba(37,99,235,.3); transition:all .25s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(37,99,235,.4); }
  .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .error {
    display:none; padding:12px 16px; border-radius:12px; margin-bottom:18px;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35);
    color:#f87171; font-size:.88rem; animation:shake .4s;
  }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .switch { text-align:center; margin-top:22px; color:var(--muted); font-size:.9rem; }
  .switch a { color:var(--accent-text); text-decoration:none; font-weight:600; }
  .switch a:hover { text-decoration:underline; }
  .back { position:absolute; top:20px; left:24px; color:var(--muted); text-decoration:none; font-size:.9rem; z-index:2; }
  .back:hover { color:var(--text); }
  .theme-fab {
    position:absolute; top:16px; right:20px; z-index:2; width:40px;height:40px;
    border-radius:12px; display:grid; place-items:center;
    background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer;
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<a href="/" class="back">← Kembali</a>
<button class="theme-fab" id="themeBtn" title="Ganti tema">
  <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<div class="card">
  <a href="/" class="logo"><img src="/assets/logo.png" alt="Synpera"> Synpera</a>
  <h1>Selamat Datang Kembali</h1>
  <p class="sub">Masuk untuk mengelola WhatsApp API kamu</p>

  <div class="error" id="error"></div>

  <form id="form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:46px">
        <button type="button" class="toggle-pw" id="togglePw" title="Tampilkan password" aria-label="Tampilkan password">
          <svg id="eyeOpen" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeClosed" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" type="submit" id="submitBtn">Masuk</button>
  </form>

  <p class="switch">Belum punya akun? <a href="/register">Daftar gratis</a></p>
</div>

<script>
  const root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    iconMoon.style.display = t === 'dark' ? 'block' : 'none';
    iconSun.style.display = t === 'dark' ? 'none' : 'block';
    localStorage.setItem('synpera-theme', t);
  }
  applyTheme(localStorage.getItem('synpera-theme') || 'dark');
  themeBtn.onclick = () => applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

  const pw = document.getElementById('password');
  togglePw.onclick = () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eyeOpen.style.display = show ? 'none' : 'block';
    eyeClosed.style.display = show ? 'block' : 'none';
    togglePw.title = show ? 'Sembunyikan password' : 'Tampilkan password';
  };

  const form = document.getElementById('form');
  const err = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  form.onsubmit = async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Memproses…';
    try {
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: pw.value }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Login gagal');
      location.href = '/dashboard';
    } catch (e2) {
      err.textContent = e2.message;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  };
</script>
</body>
</html>
